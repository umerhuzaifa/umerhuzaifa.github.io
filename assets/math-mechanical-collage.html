<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical & Mechanical Collage</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.03) 3px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.03) 3px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
        }

        .collage-container {
            position: relative;
            width: 95vw;
            max-width: 1400px;
            height: 90vh;
            max-height: 900px;
            perspective: 1200px;
        }

        .equation, .mechanical {
            position: absolute;
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 183, 77, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .equation:hover, .mechanical:hover {
            transform: translateZ(20px) scale(1.05);
            box-shadow: 
                0 12px 48px rgba(255, 183, 77, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 183, 77, 0.7);
        }

        .equation {
            font-family: 'Crimson Text', serif;
            font-size: 1.4rem;
            color: #ffb74d;
            font-style: italic;
        }

        .equation .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #90caf9;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;
            font-style: normal;
        }

        .mechanical {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(144, 202, 249, 0.4);
        }

        .mechanical svg {
            display: block;
            filter: drop-shadow(0 0 10px rgba(144, 202, 249, 0.3));
        }

        /* Individual positioning and rotation */
        .eq1 {
            top: 35%;
            left: 50%;
            transform: rotate(-3deg);
            animation-delay: 0s;
        }

        .eq2 {
            top: 15%;
            right: 15%;
            transform: rotate(2deg);
            animation-delay: 1s;
        }

        .eq3 {
            top: 45%;
            left: 5%;
            transform: rotate(-5deg);
            animation-delay: 2s;
        }

        .eq4 {
            bottom: 20%;
            right: 10%;
            transform: rotate(4deg);
            animation-delay: 3s;
        }

        .eq5 {
            bottom: 8%;
            left: 25%;
            transform: rotate(-2deg);
            animation-delay: 0.5s;
        }

        .mech1 {
            top: 30%;
            right: 5%;
            transform: rotate(5deg);
            animation-delay: 1.5s;
        }

        .mech2 {
            top: 30%;
            left: 20%;
            transform: rotate(-4deg);
            animation-delay: 2.5s;
        }

        .mech3 {
            bottom: 15%;
            left: 45%;
            transform: rotate(3deg);
            animation-delay: 3.5s;
        }

        .mech4 {
            top: 55%;
            right: 5%;
            transform: rotate(-6deg);
            animation-delay: 4s;
        }

        .eq6 {
            top: 65%;
            left: 18%;
            transform: rotate(1deg);
            animation-delay: 4.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(var(--rotation, 0deg));
            }
            50% {
                transform: translateY(-20px) rotate(var(--rotation, 0deg));
            }
        }

        .gear {
            animation: rotate 10s linear infinite;
            transform-origin: center;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pendulum-bob {
            animation: swing 2s ease-in-out infinite;
            transform-origin: 100px 20px;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        .spring-coil {
            animation: compress 1.5s ease-in-out infinite;
        }

        @keyframes compress {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.85); }
        }

        @media (max-width: 768px) {
            .equation, .mechanical {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
            
            .mechanical svg {
                width: 120px !important;
                height: 120px !important;
            }
        }
    </style>
</head>
<body>
    <div class="collage-container">
        <!-- Mathematical Equations -->        

        <div class="equation eq1" style="--rotation: 2deg;">
            <span class="label">Euler's Identity</span>
            e<sup>iπ</sup> + 1 = 0
        </div>


        <div class="equation eq2" style="--rotation: 1deg;">
            <span class="label">Fourier Transform</span>
            F(ω) = ∫<sub>-∞</sub><sup>∞</sup> f(t)e<sup>-iωt</sup>dt
        </div>

        <!-- Mechanical Systems -->
        <div class="mechanical mech1" style="--rotation: 5deg;">
            <svg width="180" height="180" viewBox="0 0 180 180">
                <circle class="gear" cx="90" cy="90" r="60" fill="none" stroke="#90caf9" stroke-width="2"/>
                <circle class="gear" cx="90" cy="90" r="45" fill="none" stroke="#90caf9" stroke-width="2"/>
                <g class="gear">
                    <rect x="85" y="25" width="10" height="15" fill="#90caf9"/>
                    <rect x="85" y="140" width="10" height="15" fill="#90caf9"/>
                    <rect x="25" y="85" width="15" height="10" fill="#90caf9"/>
                    <rect x="140" y="85" width="15" height="10" fill="#90caf9"/>
                    <rect x="45" y="45" width="12" height="12" fill="#90caf9" transform="rotate(45 51 51)"/>
                    <rect x="123" y="45" width="12" height="12" fill="#90caf9" transform="rotate(45 129 51)"/>
                    <rect x="45" y="123" width="12" height="12" fill="#90caf9" transform="rotate(45 51 129)"/>
                    <rect x="123" y="123" width="12" height="12" fill="#90caf9" transform="rotate(45 129 129)"/>
                </g>
                <circle cx="90" cy="90" r="10" fill="#ffb74d"/>
            </svg>
        </div>
        <div class="mechanical mech2" style="--rotation: 3deg;">
            <svg width="200" height="180" viewBox="0 0 200 180">
                <!-- Pendulum -->
                <line x1="100" y1="20" x2="100" y2="15" stroke="#ffb74d" stroke-width="3"/>
                <circle cx="100" cy="20" r="5" fill="#90caf9"/>
                <g class="pendulum-bob">
                    <line x1="100" y1="20" x2="100" y2="120" stroke="#90caf9" stroke-width="2"/>
                    <circle cx="100" cy="120" r="20" fill="#ffb74d" stroke="#90caf9" stroke-width="2"/>
                </g>
                <path d="M 60 140 Q 100 150, 140 140" stroke="#90caf9" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
                <text x="100" y="170" text-anchor="middle" fill="#90caf9" font-size="12" font-family="JetBrains Mono">θ</text>
            </svg>
        </div>

        <div class="mechanical mech3" style="--rotation: -6deg;">
            <svg width="160" height="200" viewBox="0 0 160 200">
                <!-- Spring-Mass System -->
                <rect x="50" y="20" width="60" height="15" fill="#90caf9"/>
                <g class="spring-coil" transform-origin="80 100">
                    <path d="M 80 35 L 75 45 L 85 55 L 75 65 L 85 75 L 75 85 L 85 95 L 75 105 L 85 115 L 75 125 L 80 135" 
                          stroke="#90caf9" stroke-width="2.5" fill="none"/>
                </g>
                <rect x="60" y="140" width="40" height="40" fill="#ffb74d" stroke="#90caf9" stroke-width="2"/>
                <text x="80" y="165" text-anchor="middle" fill="#0a0e27" font-size="16" font-weight="bold" font-family="JetBrains Mono">m</text>
            </svg>
        </div>
    </div>
</body>
</html>
