<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Umer Huzaifa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#2C2C2A;
    --paper:#F3F1EA;
    --paper-dim:#EEEDFE;
    --cobalt:#3C3489;
    --cobalt-soft:#EEEDFE;
    --coral:#F0997B;
    --line: #D9D6CC;
    --ink-soft: #5F5E5A;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: #3C3489;
    background-image:
      radial-gradient(circle at 18% 15%, rgba(240,153,123,0.18), transparent 40%),
      radial-gradient(circle at 82% 85%, rgba(238,237,254,0.12), transparent 45%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    padding: 48px 20px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }

  .hint{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: rgba(243,241,234,0.45);
    display:flex; align-items:center; gap:8px;
  }
  .hint svg{ width:13px; height:13px; opacity:0.8; }

  .card-wrap{
    width: 380px;
    max-width: 90vw;
    aspect-ratio: 1.72 / 1;
    perspective: 1600px;
  }

  .card{
    position:relative;
    width:100%; height:100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute; inset:0;
    border-radius: 18px;
    backface-visibility:hidden;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 24px 60px -18px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.25);
    overflow:hidden;
    padding: 26px 28px;
    display:flex; flex-direction:column; justify-content:space-between;
  }

  .face::before{
    content:"";
    position:absolute; inset:0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(circle at 100% 0%, black, transparent 55%);
    mask-image: radial-gradient(circle at 100% 0%, black, transparent 55%);
    opacity:0.6;
    pointer-events:none;
  }

  /* FRONT */
  .front-top{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1;}
  .mono-badge{
    width:54px; height:54px; border-radius:50%;
    background: var(--ink);
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:16px; letter-spacing:0.01em;
    position:relative;
    box-shadow: 0 6px 14px -6px rgba(21,24,29,0.5);
    overflow:hidden;
    border:2px solid var(--paper);
    outline: 2px solid var(--cobalt);
  }
  .mono-badge img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .mono-badge::after{
    content:"";
    position:absolute; right:-2px; bottom:-2px;
    width:11px; height:11px; border-radius:50%;
    background: var(--coral);
    border:2px solid var(--paper);
    z-index:2;
  }

  .brandmark{
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.12em;
    color: var(--ink-soft);
    line-height:1.5;
    text-transform:uppercase;
  }
  .brandmark strong{ color:var(--ink); display:block; font-size:11px; letter-spacing:0.1em;}

  .front-main{ position:relative; z-index:1; }
  .front-main .name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(24px, 6.2vw, 30px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 6px 0;
  }
  .front-main .role{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--coral);
    font-weight:600;
  }
  .front-main .role::before{
    content:"";
    width:16px; height:1px;
    background: var(--coral);
    display:inline-block;
  }

  .front-bottom{
    display:flex; justify-content:space-between; align-items:flex-end;
    position:relative; z-index:1;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color: var(--ink-soft);
    text-transform:uppercase;
  }
  .flip-cue{
    display:flex; align-items:center; gap:6px;
    color: var(--ink-soft);
  }
  .flip-cue svg{ width:11px; height:11px; }

  /* BACK */
  .back{ transform: rotateY(180deg); justify-content:flex-start; gap:14px; }
  .back-header{
    display:flex; justify-content:space-between; align-items:center;
    position:relative; z-index:1;
  }
  .back-header .label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .back-header .mini-badge{
    width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--paper);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:9px;
    display:flex;align-items:center;justify-content:center;
  }

  .links{
    position:relative; z-index:1;
    display:flex; flex-direction:column; gap:8px;
    margin-top:2px;
  }
  .link-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 9px 12px;
    background: var(--paper-dim);
    border:1px solid var(--line);
    border-radius:10px;
    text-decoration:none;
    color:var(--ink);
    transition: background 0.15s ease, transform 0.15s ease, border-color .15s ease;
  }
  .link-row:hover{ background: var(--cobalt-soft); border-color: rgba(47,95,255,0.35); transform: translateX(2px); }
  .link-row .l-left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .link-row svg{ width:14px; height:14px; flex-shrink:0; color:var(--cobalt); }
  .link-row .l-text{
    display:flex; flex-direction:column; min-width:0;
  }
  .link-row .l-text .k{
    font-family:'JetBrains Mono', monospace;
    font-size:8.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .link-row .l-text .v{
    font-size:12.5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .link-row .arrow{ opacity:0.4; flex-shrink:0; }
  .link-row .arrow svg{ color:var(--ink); width:11px; height:11px; }

  .save-btn{
    position:relative; z-index:1;
    margin-top:auto;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: var(--ink);
    color: var(--paper);
    border:none;
    border-radius:10px;
    padding:11px 14px;
    font-family:'Inter', sans-serif;
    font-weight:600; font-size:12.5px;
    letter-spacing:0.01em;
    cursor:pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .save-btn:hover{ background:#26292f; }
  .save-btn:active{ transform: scale(0.98); }
  .save-btn svg{ width:13px; height:13px; }

  @media (max-width: 420px){
    .card-wrap{ aspect-ratio: 1.6 / 1; }
    .front-main .name{ font-size:22px; }
  }

  .footer-note{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color: rgba(243,241,234,0.32);
    letter-spacing:0.08em;
  }
</style>
</head>

<script>
  const card = document.getElementById('card');
  card.addEventListener('click', () => card.classList.toggle('flipped'));

  function saveContact(){
    const vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Huzaifa;Umer;;;',
      'FN:Umer Huzaifa',
      'TITLE:Device Designer',
      'EMAIL;TYPE=INTERNET:umerhuzaifa@gmail.com',
      'URL:https://umerhuzaifa.com',
      'X-SOCIALPROFILE;TYPE=linkedin:https://linkedin.com/in/uhuzaifa',
      'END:VCARD'
    ].join('\n');
    const blob = new Blob([vcard], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Umer_Huzaifa.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
