<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeXLab · LaTeX editor in your browser</title>
<meta name="description" content="Write and compile LaTeX documents entirely in your browser. No account, no server.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // set the theme before first paint so there is no flash
  try {
    var s = JSON.parse(localStorage.getItem('texlab.settings.v1') || '{}');
    var t = s.theme || 'system';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">TeXLab needs JavaScript to run the LaTeX engine in your browser.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
